[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Flash/debug over the DevKitC-1 *native* USB-C port (labeled "USB", not "UART").
; These make Serial appear as a USB-CDC device on that port.
build_flags =
    -I src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    robtillaart/INA226@^0.6.0
